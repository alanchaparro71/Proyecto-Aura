<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AURA - Experiencia Inteligente</title>
<link rel="stylesheet" href="aura.css">
</head>

<body>

<audio id="music" loop></audio>

<div class="loader">
    AURA
</div>

<canvas id="bg"></canvas>

<div class="container">

<h1>AURA</h1>

<video class="gif-aura" autoplay loop muted playsinline>
    <source src="mi gif.mp4" type="video/mp4">
</video>

<p id="welcome">
Bienvenido a la experiencia interactiva
</p>

<input type="text" id="name" placeholder="Tu nombre">

<input type="color" id="color">

<button onclick="saveData()">
Guardar memoria
</button>

<h2>Modo emocional</h2>

<div class="mode-buttons">

<button onclick="setMode('feliz')">
Feliz
</button>

<button onclick="setMode('tranquilo')">
Tranquilo
</button>

<button onclick="setMode('motivado')">
Motivado
</button>

<button onclick="setMode('creativo')">
Creativo
</button>

<button onclick="setMode('misterioso')">
Misterioso
</button>

</div>

<h2>IA AURA</h2>

<div class="aura-ai">

<p id="aiMessage">
Hola humano... estoy observando tu energía digital.
</p>

<button onclick="speakAura()">
Hablar con AURA
</button>

<button onclick="startVoice()">
Activar voz
</button>

</div>

<h2>Modo Matrix</h2>

<button onclick="toggleMatrix()">
Activar Matrix
</button>

<h2>Estadísticas</h2>

<div class="stats">

<p>
Clicks:
<span id="clickCount">0</span>
</p>

<p id="favoriteEmotion">
    Emoción favorita: ninguna
</p>

<p>
Tiempo:
<span id="timeCount">0</span>s
</p>

</div>

<h2>Modo automático</h2>

<p id="timeMode">
Detectando horario...
</p>

</div>

<script src="aura.js"></script>

</body>
</html>
